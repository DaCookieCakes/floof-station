- type: entity
  parent: KitchenElectricGrill
  id: TP14KitchenOven
  name: oven
  description: A stovetop oven. It looks brand new.
  suffix: Trieste, Service
  components:
  - type: Microwave
    cookTimeMultiplier: 0.25 # Faster than a microwave.
    capacity: 12 # THREE grilled cheese... waow.
    canMicrowaveIdsSafely: true
    explosionChance: 0.0
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: icon }
          Broken: { state: icon }
          Cooking: { state: icon }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: blank }
          Broken: { state: blank }
          Cooking: { state: running }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: low }
          Medium: { visible: true, state: medium }
          High: { visible: true, state: high }
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _TP/Structures/Machines/oven.rsi
    drawdepth: SmallObjects
    snapCardinals: false
    layers:
    - state: icon
      map: [ "enum.MicrowaveVisualizerLayers.Base" ]
    - state: icon
      map: [ "enum.EntityHeaterVisuals.Setting" ]
    - state: blank
      shader: unshaded
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.Key:
        type: OvenBoundUserInterface
  - type: ContainerContainer
    containers:
      microwave_entity_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - microwave_entity_container
  - type: ApcPowerReceiver
    powerLoad: 5
  - type: PowerState
    idlePowerDraw: 5
    workingPowerDraw: 1000
  - type: Machine
    board: TP14OvenMachineCircuitboard
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        layer:
        - HighImpassable
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: DeviceLinkSink
    ports:
    - On
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetwork
    range: 200
