- type: entity
  id: PointDefenseBeam
  name: Point Defense beam
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    maxDistance: 30
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: pd_muzzle
    travelFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: pd_trace
    impactFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: pd_impact

# Apollo Plasma Bolt - Focused ship-to-ship bolt: high direct heat, small blast
- type: entity
  id: ApolloHeavyLaser
  name: apollo plasma bolt
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: heavylaser
      color: "#FF44FF"
    scale: 0.8, 0.8
  - type: Projectile
    damage:
      types:
        Heat: 200
        Structural: 80
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 140
    intensitySlope: 10
    maxIntensity: 14
    canCreateVacuum: true
  - type: TimedDespawn
    lifetime: 2.0
  - type: PointLight
    radius: 3.5
    energy: 2.5
    color: "#FF44FF"
  - type: RadarBlip
    color: "#FF44FF"
    scale: 0.9
    shape: Circle
    requireInSpace: true

# Scylla Laser Bolt - Devastatingly concentrated energy bolt
- type: entity
  id: ScyllaWideLaser
  name: scylla laser bolt
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: heavylaser
      color: "#00CCFF"
    scale: 2.5, 2.5
  - type: Projectile
    damage:
      types:
        Heat: 1100           # laser burns straight through armour
        Structural: 700
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 700      # concentrated, intense at epicenter — not wide like Leviathan
    intensitySlope: 9
    maxIntensity: 110
    canCreateVacuum: true
  - type: TimedDespawn
    lifetime: 5.0
  - type: PointLight
    radius: 9.0
    energy: 7.0
    color: "#00CCFF"
  - type: RadarBlip
    color: "#00CCFF"
    scale: 1.8
    shape: Circle
    requireInSpace: true

