- type: entity
  abstract: true
  id: BaseGasLinkPipe
  name: gas link pipe
  description: Shares its pipe's gas with the matching pipe on the linked end.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Visibility
    layer: 1
  - type: SubFloorHide
  - type: Sprite
    drawdepth: ThinPipe
    visible: false
  - type: Appearance
  - type: PipeAppearance
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
  - type: AtmosPipeLayers
    spriteRsiPaths: {}
    pipeLayersLocked: true
  - type: AtmosDevice
  - type: GasLink
