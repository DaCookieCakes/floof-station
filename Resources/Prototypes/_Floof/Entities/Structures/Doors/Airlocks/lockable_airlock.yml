# Does not reveal info and has no masters
- type: entity
  parent: [IdLockableBaseNoAccess, Airlock]
  id: AirlockLockableBaseNoAccess
  name: Lockable Airlock
  abstract: true
  components:
  - type: Lock
    locked: false

# Reveals info and has Captain and HoP as masters
- type: entity
  parent: [IdLockableBase, AirlockLockableBaseNoAccess]
  id: AirlockLockableBase
  name: Lockable Airlock
  abstract: true

# Same as above, but with the command sprite. Use for heads of staff.
- type: entity
  parent: AirlockLockableBase
  id: AirlockLockableCommandBase
  name: Lockable Airlock
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/command-base.rsi
  - type: WiresPanelSecurity
    securityLevel: medSecurity
  - type: Wires
    layoutId: AirlockCommand

# Bartender
- type: entity
  parent: AirlockLockableBase
  id: AirlockLockableBartender
  name: Bartender's dorm
  suffix: Lockable, Bar
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsBar ]

