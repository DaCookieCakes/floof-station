# Generic

- type: loadoutGroup
  id: MedicalMask
  name: loadout-group-medical-mask
  minLimit: 0
  loadouts:
  - SterileMask

- type: loadoutGroup
  id: MedicalBackpack
  name: loadout-group-medical-doctor-backpack
  loadouts:
  - MedicalDoctorBackpack
  - MedicalDoctorSatchel
  - MedicalDoctorDuffel

- type: loadoutGroup
  id: MedicalShoes
  name: loadout-group-medical-doctor-shoes
  minLimit: 0 # FLOOF
  defaultSelected: 1 # FLOOF
  loadouts:
  - WhiteShoes
  - MedicalWinterBoots

- type: loadoutGroup
  id: SurvivalMedical
  name: loadout-group-survival-medical
  minLimit: 2
  hidden: true
  loadouts:
  - EmergencyNitrogenMedical
  - EmergencyOxygenMedical
  - LoadoutSpeciesVoxNitrogen
  - LoadoutEmergencyWaterMedical # Floof: Added.
  - LoadoutSpeciesPocketDoubleWater # Floof: Added.
  - LoadoutEmergencyShadekinMedical # Floof: Added.

